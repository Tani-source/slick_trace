[project]
name = "slicktrace-backend"
version = "0.1.0"
description = "Backend for SlickTrace (Oil Spill Source Attribution System)"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
    "pandas",
    "geopandas",
    "shapely",
    "torch",
    "torchvision",
    "opendrift",
    "scikit-learn",
    "scipy",
    "numpy",
    "pillow"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
